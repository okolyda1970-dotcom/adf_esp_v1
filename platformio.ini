; PlatformIO Project Configuration File
;
; ADF4350 Synthesizer Controller for ESP32-C3
;

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Serial port (раскомментируй и укажи свой порт)
; upload_port = COM3
; monitor_port = COM3

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
